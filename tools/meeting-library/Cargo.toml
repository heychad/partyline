[package]
name = "partyline-meeting-library"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "../../frontend/src-tauri/src/cloud/library.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
hound = "3.5"

url = "2.5"
